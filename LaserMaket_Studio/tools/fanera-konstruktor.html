<style>
/* Layout: boshqaruv paneli (chap) + ish stoli (o'ng): 3D model, chizma, fanera varaqlari tablarda */
:root{
  --bg:#E7EAE8; --panel:#F5F6F4; --ink:#1A2120; --mute:#5A6663; --line:#C9D0CD;
  --accent:#D3361F; --accent-ink:#FFFFFF; --bench:#D6DCD9; --stage-a:#F7F8F6; --stage-b:#CBD3CF;
  --ok:#2F7A4B; --warn:#B26A00;
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'Barlow','Helvetica Neue',Arial,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1311; --panel:#171C1A; --ink:#E7EBE9; --mute:#92A09B; --line:#2A3330;
  --accent:#FF6B50; --accent-ink:#1A0803; --bench:#0B0E0D; --stage-a:#222926; --stage-b:#0D100F; --ok:#5FC285; --warn:#E6A23A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1311; --panel:#171C1A; --ink:#E7EBE9; --mute:#92A09B; --line:#2A3330;
  --accent:#FF6B50; --accent-ink:#1A0803; --bench:#0B0E0D; --stage-a:#222926; --stage-b:#0D100F; --ok:#5FC285; --warn:#E6A23A; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:20px 40px}
*{box-sizing:border-box}
.wrap{max-width:1280px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;border-bottom:2px solid var(--ink);padding-bottom:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:2.1rem;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1}
header p{margin:0;color:var(--mute);max-width:60ch;text-wrap:pretty}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
aside{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:16px;position:sticky;top:env(safe-area-inset-top,0px)}
@media (max-width:900px){aside{position:static}}
.grp{display:flex;flex-direction:column;gap:10px;min-width:0;border:0;padding:0;margin:0}
.grp>legend,.lbl{font-family:var(--f-display);font-weight:600;font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);padding:0}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld span{font-size:.85rem;color:var(--mute)}
input[type=text],input[type=number]{width:100%;font:500 .95rem var(--f-mono);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 10px;min-width:0}
input[type=text]{text-transform:uppercase}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg label{grid-column:span 2}.seg label:nth-child(n+4){grid-column:span 3}
.seg label{position:relative;text-align:center;cursor:pointer;font-weight:600;font-size:.88rem;padding:8px 4px;background:var(--bg);color:var(--mute)}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg label:has(input:checked){background:var(--ink);color:var(--bg)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.stat b{display:block;font-family:var(--f-mono);font-weight:500;font-size:1.25rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--mute)}
.bench{min-width:0;display:flex;flex-direction:column;gap:14px}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button{flex:none;font:600 .95rem var(--f-display);letter-spacing:.06em;text-transform:uppercase;background:none;border:0;border-bottom:3px solid transparent;color:var(--mute);padding:10px 14px;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.bar h2{font-family:var(--f-display);font-size:1.4rem;text-transform:uppercase;letter-spacing:.04em;margin:0;margin-right:auto}
.legend{display:flex;gap:14px;font-size:.82rem;color:var(--mute)}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid;vertical-align:middle;margin-right:6px}
.btn{font:600 .9rem var(--f-body);border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:4px;padding:8px 14px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:6px 10px;font-size:.82rem}
.btn[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.mode{display:flex}
.mode .btn{border-radius:0}
.mode .btn:first-child{border-radius:4px 0 0 4px}.mode .btn:last-child{border-radius:0 4px 4px 0;border-left:0}
.sheet{background:var(--bench);border:1px solid var(--line);border-radius:4px;padding:10px;overflow:auto}
.sheet svg{display:block;width:100%;height:auto;min-width:560px}
.note{font-size:.85rem;color:var(--mute);margin:0}
.chip{font:500 .8rem var(--f-mono);padding:3px 8px;border-radius:3px;border:1px solid var(--line);background:var(--panel)}
.chip.ok{color:var(--ok);border-color:var(--ok)}.chip.warn{color:var(--warn);border-color:var(--warn)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:600 .78rem var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
tr.cat td{font:700 .95rem var(--f-display);letter-spacing:.06em;text-transform:uppercase;background:var(--bg)}
#fallback{width:100%;height:140px;font:.75rem var(--f-mono);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:8px}
.view{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px;overflow:auto}
.view svg{display:block;width:100%;height:auto;min-width:520px}
.v-body{fill:var(--bg);stroke:var(--ink);stroke-width:1.4px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.v-glass{fill:var(--bench);stroke:var(--ink);stroke-width:1px;vector-effect:non-scaling-stroke}
.v-line{fill:none;stroke:var(--ink);stroke-width:1px;vector-effect:non-scaling-stroke}
.v-tyre{fill:var(--ink)}.v-rim{fill:var(--bg);stroke:var(--ink);stroke-width:1px;vector-effect:non-scaling-stroke}
.v-dim{stroke:var(--accent);stroke-width:1px;vector-effect:non-scaling-stroke;fill:none}
.v-txt{fill:var(--accent);font-family:var(--f-mono);font-weight:500}
.v-cap{fill:var(--mute);font-family:var(--f-display);font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.stage3d{position:relative;height:min(74vh,620px);min-height:360px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,var(--stage-a),var(--stage-b))}
.stage3d canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.stage3d canvas:active{cursor:grabbing}
.stage3d .msg{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--mute)}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.ctl label.sl{display:flex;align-items:center;gap:10px;font-weight:600;font-size:.9rem;flex:1 1 260px;min-width:0}
.ctl label.sl input{flex:1;min-width:0;accent-color:var(--accent)}
.ctl .views{display:flex;gap:6px;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.tabs button{transition:color .15s}}
</style>

<div class="wrap">
  <header>
    <h1>Fanera Konstruktor</h1>
    <p>Avtomobil o'lchamlarini kiriting. 3D model, chizmalar va lazer kesish uchun fanera detallari varaqlari avtomatik hisoblanadi.</p>
  </header>

  <div class="layout">
    <aside aria-label="Model sozlamalari">
      <fieldset class="grp">
        <legend>Model</legend>
        <label class="fld"><span>Nomi (davlat raqami plastinasiga yoziladi)</span><input type="text" id="name" value="COBALT" maxlength="12" autocomplete="off"></label>
        <div class="fld"><span>Kuzov turi</span>
          <div class="seg" role="radiogroup" aria-label="Kuzov turi">
            <label><input type="radio" name="type" value="sedan" checked>Sedan</label>
            <label><input type="radio" name="type" value="hatch">Xetchbek</label>
            <label><input type="radio" name="type" value="suv">Krossover</label>
            <label><input type="radio" name="type" value="zh6">Jiguli 2106</label>
            <label><input type="radio" name="type" value="zh1">Jiguli 2101</label>
          </div>
        </div>
      </fieldset>

      <fieldset class="grp">
        <legend>O'lchamlar, mm</legend>
        <div class="row3">
          <label class="fld"><span>Uzunlik</span><input type="number" id="L" value="450" min="200" max="900" step="10"></label>
          <label class="fld"><span>Eni</span><input type="number" id="W" value="180" min="80" max="400" step="5"></label>
          <label class="fld"><span>Balandlik</span><input type="number" id="H" value="160" min="70" max="350" step="5"></label>
        </div>
      </fieldset>

      <fieldset class="grp">
        <legend>Fanera va lazer</legend>
        <div class="row2">
          <label class="fld"><span>Qalinlik</span><input type="number" id="t" value="3" min="2" max="6" step="0.5"></label>
          <label class="fld"><span>Kerf (kesish kengligi)</span><input type="number" id="kerf" value="0.1" min="0" max="0.5" step="0.05"></label>
        </div>
        <div class="row2">
          <label class="fld"><span>Varaq eni</span><input type="number" id="SW" value="900" min="300" max="1500" step="50"></label>
          <label class="fld"><span>Varaq bo'yi</span><input type="number" id="SH" value="600" min="200" max="1500" step="50"></label>
        </div>
      </fieldset>

      <fieldset class="grp">
        <legend>G'ildirak</legend>
        <div class="row2">
          <label class="fld"><span>Disk kesiklari</span><input type="number" id="spokes" value="10" min="5" max="14" step="1"></label>
          <label class="fld"><span>Shina qatlami</span><input type="number" id="layers" value="2" min="1" max="4" step="1"></label>
        </div>
      </fieldset>

      <div class="stats" aria-live="polite">
        <div class="stat"><b id="sPieces">0</b><span>detal soni</span></div>
        <div class="stat"><b id="sArea">0</b><span>fanera, dm²</span></div>
        <div class="stat"><b id="sWheel">0</b><span>g'ildirak Ø, mm</span></div>
        <div class="stat"><b id="sSheets">0</b><span>varaq (taxminan)</span></div>
      </div>
    </aside>

    <main class="bench">
      <div class="tabs" role="tablist" id="tabs" aria-label="Bo'limlar"></div>
      <div id="stage"></div>
      <textarea id="fallback" hidden readonly aria-label="SVG kodi"></textarea>
    </main>
  </div>
</div>

/* ---------- path helpers ---------- */

var PROF={

,

        hood:[3,4],wind:[4,6],roof:[6,7],rear:[7,8],deck:[8,9],
        w:[[[.31,.62],[.385,.90],[.425,.955],[.52,.955],[.52,.62]],[[.54,.62],[.54,.955],[.63,.955],[.70,.84],[.725,.62]]]},
 zh1:{fx:.19,rx:.772,dr:.139,ds:[.295,.52,.715],lamp:'round',o:[[0,.1],[0,.34],[.012,.45],[.03,.50],[.27,.58],[.385,.93],[.43,1],[.65,1],[.78,.66],[.965,.66],[.995,.60],[1,.30],[1,.1]],
        hood:[3,4],wind:[4,6],roof:[6,7],rear:[7,8],deck:[8,9],
        w:[[[.31,.62],[.385,.90],[.425,.955],[.52,.955],[.52,.62]],[[.54,.62],[.54,.955],[.63,.955],[.70,.84],[.725,.62]]]}
};
function wheelD(s){return Math.max(.3*s.H,Math.min(PROF[s.type].dr*s.L,.55*s.H))}

function sideGeom(s,extraHoles){
  var L=s.L,H=s.H,p=PROF[s.type],D=wheelD(s),base=.9*H,cy=H-D/2,fx=p.fx*L,rx=p.rx*L,ra=D/2+Math.max(2,D*.05);

/* ---------- shelf packing ---------- */
function pack(parts,SW){
  var gap=2.5,m=5,items=[];
  parts.forEach(function(p){for(var i=0;i<p.qty;i++)items.push(p)});
  items.sort(function(a,b){return b.h-a.h||b.w-a.w});
  var x=m,y=m,rowH=0,placed=[];
  items.forEach(function(p){
    if(x+p.w>SW-m&&x>m){x=m;y+=rowH+gap;rowH=0}
    placed.push({p:p,x:x,y:y});x+=p.w+gap;rowH=Math.max(rowH,p.h);
  });
  return {placed:placed,H:Math.ceil(y+rowH+m),wide:items.some(function(p){return p.w>SW-2*m})};
}

function arcPts(x1,y1,r,fa,fs,x2,y2){

}
function parsePath(d){

    else if(c==='L'){x=v[0];y=v[1];cur.push([x,y])}
    else if(c==='H'){x=v[0];cur.push([x,y])}
    else if(c==='V'){y=v[0];cur.push([x,y])}
    else if(c==='A'){var pts=arcPts(x,y,v[0],v[3],v[4],v[5],v[6]);for(var i=0;i<pts.length;i++)cur.push(pts[i]);x=v[5];y=v[6]}

    var q=nascarSvg(st.mode,true);
    html='<div class="bar"><h2>NASCAR namuna</h2>'+legend()+
      '<div class="mode" role="group" aria-label="Ko‘rinish rejimi"><button class="btn" id="mWood" aria-pressed="'+(st.mode==='wood')+'">Fanera</button><button class="btn" id="mLaser" aria-pressed="'+(st.mode==='laser')+'">Lazer</button></div>'+
      '<button class="btn pri" id="copy">SVG nusxalash</button></div>'+
      '<div><span class="chip">Varaq '+n(q.W).toFixed(0)+' × '+n(q.H).toFixed(0)+' mm · '+NAS.parts.length+' kontur · fanera '+st.t+' mm</span></div>'+
      '<div class="sheet">'+q.svg+'</div>'+
      '<p class="note">Bu poyga mashinasi (NASCAR) uchun tayyor lazer rejasi: tishli ulanishlar, qatlamli g‘ildiraklar va qizil gravirovka maydonlari (raqam 35, chiziqlar). Reja 3 mm fanera uchun chizilgan. Chap paneldagi qalinlikni o‘zgartirsangiz, hamma o‘lcham shunga mos kattalashadi yoki kichrayadi. Original: Paulo Bubolz.</p>';
  }else if(st.tab==='list'){
    html='<div class="bar"><h2>Detallar ro‘yxati</h2></div><div class="tablewrap"><table><thead><tr><th>Detal</th><th class="n">Soni</th><th class="n">Eni, mm</th><th class="n">Bo‘yi, mm</th></tr></thead><tbody>';
    CATS.forEach(function(c){html+='<tr class="cat"><td colspan="4">'+c[1]+'</td></tr>';
      PARTS.filter(function(p){return p.cat===c[0]}).forEach(function(p){html+='<tr><td>'+p.name+'</td><td class="n">'+p.qty+'</td><td class="n">'+n(p.w).toFixed(1)+'</td><td class="n">'+n(p.h).toFixed(1)+'</td></tr>'})});
    html+='</tbody></table></div>';
  }else{
    var title=st.tab==='all'?'Umumiy varaq':CATS.filter(function(c){return c[0]===st.tab})[0][1];
    var r=sheetSvg(st.tab,st.mode,true,PARTS);
    var fits=r.H<=st.SH&&!r.wide;
    html='<div class="bar"><h2>'+title+'</h2>'+legend()+
      '<div class="mode" role="group" aria-label="Ko‘rinish rejimi"><button class="btn" id="mWood" aria-pressed="'+(st.mode==='wood')+'">Fanera</button><button class="btn" id="mLaser" aria-pressed="'+(st.mode==='laser')+'">Lazer</button></div>'+
      '<button class="btn pri" id="copy">SVG nusxalash</button></div>'+
      '<div><span class="chip '+(fits?'ok':'warn')+'">Varaq '+st.SW+' × '+r.H+' mm'+(fits?' · sig‘adi':(r.wide?' · detal varaq enidan katta':' · '+st.SH+' mm dan baland'))+'</span></div>'+
      '<div class="sheet">'+r.svg+'</div>'+
      '<p class="note">Nusxalangan SVG milimetrda, kesish chiziqlari ko‘k, gravirovka qizil. Faylni .svg nomi bilan saqlang va lazer dasturida oching. Matnni dasturda egri chiziqqa (outline) aylantiring.</p>';
  }
  stage.innerHTML=html;
  stage.setAttribute('role','tabpanel');stage.setAttribute('aria-labelledby','tab-'+st.tab);
  if(st.tab==='3d')mount3D($('box'),PARTS);
}

function copyText(txt,btn){
  var fb=$('fallback');
  function done(){var o=btn.textContent;btn.textContent='Nusxalandi';setTimeout(function(){btn.textContent=o},1600);fb.hidden=true}
  function manual(){fb.hidden=false;fb.value=txt;fb.focus();fb.select();btn.textContent='Kodni qo‘lda nusxalang (Ctrl+C)'}
  try{navigator.clipboard.writeText(txt).then(done,manual)}catch(e){manual()}
}

/* ---------- events ---------- */
function clamp(v,a,b,d){v=parseFloat(v);if(isNaN(v))return d;return Math.min(b,Math.max(a,v))}
function readInputs(){
  st.name=$('name').value.replace(/[^A-Za-z0-9 \-]/g,'').slice(0,12)||'MODEL';
  st.L=clamp($('L').value,200,900,450);st.W=clamp($('W').value,80,400,180);st.H=clamp($('H').value,70,350,160);
  st.t=clamp($('t').value,2,6,3);st.kerf=clamp($('kerf').value,0,.5,.1);
  st.SW=clamp($('SW').value,300,1500,900);st.SH=clamp($('SH').value,200,1500,600);
  st.spokes=Math.round(clamp($('spokes').value,5,14,10));st.layers=Math.round(clamp($('layers').value,1,4,2));
}
var pend=0;
function later(){if(pend)return;pend=requestAnimationFrame(function(){pend=0;render()})}
['name','L','W','H','t','kerf','SW','SH','spokes','layers'].forEach(function(id){$(id).addEventListener('input',function(){readInputs();later()})});
var PRESET={zh6:{name:'VAZ-2106',L:450,W:175,H:156},zh1:{name:'VAZ-2101',L:450,W:179,H:160}};
document.querySelectorAll('input[name=type]').forEach(function(r){r.addEventListener('change',function(){
  st.type=r.value;var p=PRESET[r.value];
  if(p){['name','L','W','H'].forEach(function(k){$(k).value=p[k]});readInputs()}
  later()})});
$('tabs').addEventListener('click',function(e){var b=e.target.closest('button[data-tab]');if(!b)return;st.tab=b.dataset.tab;$('fallback').hidden=true;render()});
$('stage').addEventListener('input',function(e){if(e.target.id==='exp'){st.explode=e.target.value/100;applyExplode()}});
$('stage').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.view){setView(b.dataset.view);return}
  if(b.id==='mWood'){st.mode='wood';render()}
  else if(b.id==='mLaser'){st.mode='laser';render()}
  else if(b.id==='copy'){copyText((st.tab==='nascar'?nascarSvg('laser',false):sheetSvg(st.tab,'laser',false,PARTS)).svg,b)}
});
$('tabs').addEventListener('keydown',function(e){
  if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;
  var i=TABS.findIndex(function(t){return t[0]===st.tab});i=(i+(e.key==='ArrowRight'?1:TABS.length-1))%TABS.length;
  st.tab=TABS[i][0];render();$('tab-'+st.tab).focus();
});
render();
})();
</script>
