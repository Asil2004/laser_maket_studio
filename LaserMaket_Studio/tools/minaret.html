      const c = it.opts.filter(o => y + o.fh <= Hs - M + 1e-9 && M + o.fw <= W - M + 1e-9).sort((a, b) => a.fh - b.fh)[0];
      if (c) { const shelf = { y, h: c.fh, x: M + c.fw + gap }; sh.shelves.push(shelf); sh.items.push({ part: it.part, b: it.b, ...c, x: M, y }); done = true; break; }
    }
    if (!done) {
